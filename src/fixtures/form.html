<!doctype html>
<meta charset="utf-8">
<title>form fixture</title>
<body>
  <h1 id="title">Sign in</h1>
  <form id="login">
    <label for="email">Email</label>
    <input id="email" name="email" placeholder="you@example.com">
    <label for="pwd">Пароль</label>
    <input id="pwd" type="password">
    <label><input type="checkbox" id="remember"> Remember me</label>
    <select id="plan"><option value="free">Free</option><option value="pro">Pro</option></select>
    <button type="submit" data-testid="submit">Войти</button>
  </form>
  <div id="orders">
    <div role="row" aria-label="Заказ 41">41</div>
    <div role="row" aria-label="Заказ 42">42</div>
  </div>
  <p id="greeting" data-testid="greeting" hidden>Привет, тестировщик</p>
  <script>
    document.getElementById('login').addEventListener('submit', (e) => {
      e.preventDefault();
      document.getElementById('greeting').hidden = false;
    });
  </script>
</body>
