<!doctype html>
<meta charset="utf-8">
<title>controls fixture</title>
<body>
  <button id="icon" aria-label="Настройки">
    <svg id="icon-glyph" width="16" height="16"><rect width="16" height="16"></rect></svg>
  </button>

  <label id="agree-label">
    <input type="checkbox" id="agree">
    <span id="agree-text">Согласен с условиями</span>
  </label>

  <fieldset id="years">
    <legend>Год</legend>
    <label><input type="radio" name="year" value="2009"> 2009</label>
    <label><input type="radio" name="year" value="2010"> 2010</label>
    <label><input type="radio" name="year" value="2011"> 2011</label>
  </fieldset>

  <button id="titled" title="Добавить фото">
    <svg id="titled-glyph" width="12" height="12"><rect width="12" height="12"></rect></svg>
  </button>
</body>
